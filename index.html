<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আবহাওয়া</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>আবহাওয়া</h1>

    <div class="search">
      <input type="text" id="cityInput" placeholder="শহরের নাম লিখুন" value="Dhaka">
      <button id="searchBtn">খুঁজুন</button>
    </div>

    <p class="status" id="status"></p>

    <section class="result hidden" id="result">
      <p class="place">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
        <span id="place"></span>
      </p>
      <p class="time" id="time"></p>

      <div class="hero">
        <span class="temp" id="temp"></span>
        <div id="iconSlot"></div>
      </div>

      <p class="desc" id="desc"></p>

      <div class="details">
        <div class="detail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v18M8 7l4-4 4 4"/>
          </svg>
          <span class="val" id="feels"></span>
          <span class="key">অনুভূত</span>
        </div>
        <div class="detail">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>
          </svg>
          <span class="val" id="humidity"></span>
          <span class="key">আর্দ্রতা</span>
        </div>
        <div class="detail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 8h11a3 3 0 1 0-3-3M3 16h14a3 3 0 1 1-3 3M3 12h18"/>
          </svg>
          <span class="val" id="wind"></span>
          <span class="key">বাতাস</span>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
